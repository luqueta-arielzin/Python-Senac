<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}




    <link rel="icon" type="image/jpg" href="{% static 'visitors/images/logo.jpg' %}">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Futura:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'visitors/css/style.css' %}">
 
    <title>{% block title %}Parque da Oktoberfest{% endblock %}</title>
</head>
<body>
     <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-4 border-info">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">
                    <img src="{% static 'visitors/images/logo.jpg' %}" alt="Logo Oktoberfest" width="90px">
                    Parque da Oktoberfest
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu_principal" 
                aria-controls="menu_principal" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu_principal">

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}">Inicio</a>
                        </li>

                         <li class="nav-item">
                            <a class="nav-link" href="{% url 'create_visitor' %}">Cadastrar Visitante</a>
                        </li>

                         <li class="nav-item">
                            <a class="nav-link" href="{% url 'visitors' %}">Visitantes</a>
                        </li>

                         <li class="nav-item">
                            <a class="nav-link" href="{% url 'estatisticas_visitor' %}">Estatísticas</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container pt-2">
        {% block content %}
        {% endblock %}
    </main>
    
</body>
</html>
